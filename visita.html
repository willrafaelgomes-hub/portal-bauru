<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#F6F1EA;color:#14253D;font:16px Arial,sans-serif}header{background:#14253D;color:white;padding:22px}main{max-width:780px;margin:auto;padding:20px}section{background:white;border-radius:16px;padding:22px;margin:0 0 16px}label{display:block;margin:12px 0}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit;margin-top:5px}button,a.btn{display:inline-block;background:#F85F08;color:white;border:0;border-radius:9px;padding:12px 16px;font:inherit;text-decoration:none;cursor:pointer;margin:5px 0}button:disabled{opacity:.5}a{color:#14253D}small{color:#596577}li{padding:8px 0}[hidden]{display:none!important} .check{display:flex;align-items:center;gap:10px}.check input{width:auto}#status{white-space:pre-wrap}</style><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Sua visita | Portal Bauru Imóveis</title></head><body><header>PORTAL BAURU IMÓVEIS</header><main><h1>Sua visita agendada</h1><p id="status" role="status">Carregando detalhes...</p><section id="app" hidden><h2 id="cliente"></h2><p id="quando"></p><p id="corretor"></p><h3>Imóveis e informações da visita</h3><ul id="lista"></ul><a class="btn" id="agenda" target="_blank" rel="noopener noreferrer">Adicionar ao Google Agenda</a><p><small>Para alterar o horário, fale com seu corretor pelo WhatsApp.</small></p></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://dtkszimtovtqdojjpqsy.supabase.co','sb_publishable_sLtgD3fLRhSkrNWd_3M5Ww_a7q4gxJi');const $=id=>document.getElementById(id);
(async()=>{try{const token=new URLSearchParams(location.search).get('token');if(!token||!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token))throw Error('Link inválido.');const {data,error}=await db.rpc('portal_consultar_visita_v2',{p_token:token});if(error)throw error;const v=Array.isArray(data)?data[0]:data;if(!v||!v.data_hora)throw Error('Visita não encontrada ou link expirado.');if(v.situacao!=='confirmada')throw Error('Esta visita não está confirmada. Consulte seu corretor.');const start=new Date(v.data_hora),end=new Date(+start+Number(v.duracao_minutos||60)*60000);$('cliente').textContent='Olá, '+(v.cliente_nome||'')+'!';$('quando').textContent=new Intl.DateTimeFormat('pt-BR',{dateStyle:'full',timeStyle:'short',timeZone:'America/Sao_Paulo'}).format(start)+' (horário de Bauru)';$('corretor').textContent='Corretor: '+(v.corretor||'');const items=Array.isArray(v.imoveis)?v.imoveis:[];for(const i of items){const li=document.createElement('li');li.textContent=[i.titulo,i.bairro].filter(Boolean).join(' • ');$('lista').append(li)}const fmt=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const u=new URL('https://calendar.google.com/calendar/render');u.search=new URLSearchParams({action:'TEMPLATE',text:'Visita imobiliária – Portal Bauru Imóveis',dates:fmt(start)+'/'+fmt(end),ctz:'America/Sao_Paulo',details:'Corretor: '+v.corretor+'\n'+items.map(i=>[i.titulo,i.bairro].filter(Boolean).join(' • ')).join('\n')});$('agenda').href=u.href;$('app').hidden=false;$('status').textContent=''}catch(e){$('status').textContent=e.message}})();</script></body></html>
