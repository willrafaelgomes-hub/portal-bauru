<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Bauru | Administração</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#14253D;background:#F6F1EA}*{box-sizing:border-box}body{margin:0}header{background:#14253D;color:white;padding:20px 5%;display:flex;align-items:center;justify-content:space-between}header strong{font-size:22px}main{max-width:1100px;margin:35px auto;padding:0 18px}.card{background:white;border-radius:18px;padding:26px;box-shadow:0 6px 30px #14253d12;margin-bottom:20px}h1{font-size:26px}h2{font-size:20px}input,select,textarea{width:100%;padding:12px;border:1px solid #d5d8dd;border-radius:9px;font:inherit;margin:7px 0 16px}textarea{min-height:110px}button{border:0;border-radius:10px;background:#F85F08;color:white;padding:12px 18px;font-weight:700;cursor:pointer}button.secondary{background:#14253D}button.ghost{background:#e9edf2;color:#14253D}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}.hidden{display:none!important}.muted{color:#697386}.item{border-top:1px solid #eee;padding:16px 0;display:flex;justify-content:space-between;gap:14px;align-items:center}.error{color:#a12820}.success{color:#176d3b}label{font-size:14px;font-weight:600}.check{display:flex;gap:8px;align-items:center;margin:12px 0}.check input{width:auto;margin:0}#status{min-height:22px}@media(max-width:550px){.item{display:block}.item button{margin:8px 6px 0 0}}</style></head><body><header><strong>Portal Bauru</strong><span>Administração de imóveis</span></header><main><section id="login" class="card"><h1>Entrar no painel</h1><p class="muted">Acesso exclusivo aos administradores autorizados.</p><form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section><section id="dashboard" class="hidden"><div class="row" style="align-items:center"><h1>Gerenciar imóveis</h1><div style="text-align:right"><button id="logout" class="ghost">Sair</button></div></div><section class="card"><div class="row"><input id="search" placeholder="Buscar condomínio, bairro, código ou título" aria-label="Buscar imóveis"><button id="new" style="flex:0 0 auto">+ Novo imóvel</button></div><div id="items"></div></section><section id="editor" class="card hidden"><h2 id="editorTitle">Novo imóvel</h2><form id="propertyForm"><div class="row"><label>Código<input id="codigo" placeholder="Ex.: BAU-001"></label><label>Título<input id="titulo" required></label></div><div class="row"><label>Finalidade<select id="finalidade"><option value="venda">Venda</option><option value="locacao">Locação</option></select></label><label>Tipo<select id="tipo"><option value="apartamento">Apartamento</option><option value="casa">Casa</option><option value="sobrado">Sobrado</option><option value="terreno">Terreno</option><option value="chacara">Chácara</option><option value="comercial">Comercial</option><option value="outro">Outro</option></select></label></div><div class="row"><label>Empreendimento<input id="empreendimento"></label><label>Bairro<input id="bairro"></label></div><div class="row"><label>Preço (R$)<input id="preco" type="number" min="0" step="0.01"></label><label>Área privativa (m²)<input id="area_privativa" type="number" min="0" step="0.01"></label></div><div class="row"><label>Quartos<input id="quartos" type="number" min="0"></label><label>Suítes<input id="suites" type="number" min="0"></label><label>Banheiros<input id="banheiros" type="number" min="0"></label><label>Vagas<input id="vagas" type="number" min="0"></label></div><label>Descrição<textarea id="descricao"></textarea></label><div class="row"><label>Situação<select id="situacao"><option value="disponivel">Disponível</option><option value="reservado">Reservado</option><option value="vendido">Vendido</option><option value="alugado">Alugado</option></select></label><label>Selo<select id="selo"><option value="nenhum">Nenhum</option><option value="novidade">Novidade</option><option value="oportunidade">Oportunidade</option><option value="preco_reduzido">Preço reduzido</option></select></label></div><label class="check"><input id="aceita_financiamento" type="checkbox"> Aceita financiamento</label><label class="check"><input id="aceita_fgts" type="checkbox"> Aceita FGTS</label><label class="check"><input id="destaque" type="checkbox"> Destacar na página inicial</label><label class="check"><input id="publicado" type="checkbox"> Publicar anúncio</label><button type="submit">Salvar imóvel</button> <button id="cancel" type="button" class="ghost">Cancelar</button></form><p class="muted">Fotografias e características avançadas serão adicionadas na próxima etapa. Cadastros podem ser salvos como rascunho.</p></section></section><p id="status" role="status"></p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://dtkszimtovtqdojjpqsy.supabase.co','sb_publishable_sLtgD3fLRhSkrNWd_3M5Ww_a7q4gxJi');
const $=id=>document.getElementById(id), fields=['codigo','titulo','descricao','finalidade','tipo','empreendimento','preco','bairro','area_privativa','quartos','suites','banheiros','vagas','situacao','selo','aceita_financiamento','aceita_fgts','destaque','publicado'];let records=[],editing=null;
function message(msg,error=false){$('status').textContent=msg;$('status').className=error?'error':'success'}
async function check(){const {data:{user}}=await supabase.auth.getUser();if(!user){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');return}const {data,error}=await supabase.rpc('portal_eh_admin');if(error||!data){message('Sua conta não está autorizada como administradora.',true);await supabase.auth.signOut();$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await load()}
async function load(){const {data,error}=await supabase.from('imoveis').select('*').order('atualizado_em',{ascending:false});if(error){message('Erro ao consultar imóveis: '+error.message,true);return}records=data||[];render()}
function render(){const q=$('search').value.trim().toLocaleLowerCase('pt-BR');const matches=records.filter(r=>[r.codigo,r.titulo,r.empreendimento,r.bairro].some(x=>(x||'').toLocaleLowerCase('pt-BR').includes(q)));const root=$('items');root.replaceChildren();if(!matches.length){const p=document.createElement('p');p.className='muted';p.textContent='Nenhum imóvel encontrado.';root.append(p)}for(const r of matches){const div=document.createElement('div');div.className='item';const details=document.createElement('div');const strong=document.createElement('strong');strong.textContent=r.titulo;const small=document.createElement('div');small.className='muted';small.textContent=[r.codigo,r.empreendimento,r.bairro,r.publicado?'Publicado':'Rascunho'].filter(Boolean).join(' • ');details.append(strong,small);const edit=document.createElement('button');edit.textContent='Editar';edit.className='secondary';edit.onclick=()=>openEditor(r);div.append(details,edit);root.append(div)}}
function openEditor(r=null){editing=r?.id||null;$('propertyForm').reset();$('editorTitle').textContent=r?'Editar imóvel':'Novo imóvel';if(r)for(const f of fields){const el=$(f);if(el.type==='checkbox')el.checked=!!r[f];else el.value=r[f]??''}$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth'})}
$('new').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').classList.add('hidden');$('search').oninput=render;
$('loginForm').onsubmit=async e=>{e.preventDefault();message('Autenticando...');const {error}=await supabase.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){message('Não foi possível entrar: '+error.message,true);return}$('password').value='';await check()};
$('logout').onclick=async()=>{await supabase.auth.signOut();message('Sessão encerrada.');await check()};
$('propertyForm').onsubmit=async e=>{e.preventDefault();const payload={};for(const f of fields){const el=$(f);payload[f]=el.type==='checkbox'?el.checked:el.value.trim()||null}for(const f of ['preco','area_privativa','quartos','suites','banheiros','vagas'])if(payload[f]!==null)payload[f]=Number(payload[f]);payload.descricao??='';const {error}=editing?await supabase.from('imoveis').update(payload).eq('id',editing):await supabase.from('imoveis').insert(payload);if(error){message('Erro ao salvar: '+error.message,true);return}message('Imóvel salvo com sucesso.');$('editor').classList.add('hidden');await load()};check();
</script></body></html>
