<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#F6F1EA;color:#14253D;font:16px Arial,sans-serif}header{background:#14253D;color:white;padding:22px}main{max-width:780px;margin:auto;padding:20px}section{background:white;border-radius:16px;padding:22px;margin:0 0 16px}label{display:block;margin:12px 0}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit;margin-top:5px}button,a.btn{display:inline-block;background:#F85F08;color:white;border:0;border-radius:9px;padding:12px 16px;font:inherit;text-decoration:none;cursor:pointer;margin:5px 0}button:disabled{opacity:.5}a{color:#14253D}small{color:#596577}li{padding:8px 0}[hidden]{display:none!important} .check{display:flex;align-items:center;gap:10px}.check input{width:auto}#status{white-space:pre-wrap}</style><title>Agendar visitas | Portal Bauru Imóveis</title></head><body><header>PORTAL BAURU IMÓVEIS</header><main><a href="admin.html">← Voltar ao painel</a><h1>Agendar visita</h1><p id="status" role="status">Verificando acesso...</p><section id="app" hidden><form id="form"><label>Nome do cliente<input id="cliente" required maxlength="120"></label><label>Corretor responsável<select id="corretor"><option>Rafael Gomes</option><option>Débora Navas</option></select></label><label>Data e horário (Bauru)<input id="data" type="datetime-local" required></label><label>Duração em minutos<input id="duracao" type="number" min="15" max="480" value="60" required></label><label>Pesquisar imóvel<input id="busca" placeholder="Código, título ou bairro"></label><div id="lista"></div><label>Imóvel de parceiro ou ponto de encontro (opcional)<textarea id="extra" maxlength="300"></textarea></label><small>Inclua apenas informações que possam ser compartilhadas com quem receber o link.</small><p><button id="salvar">Gerar link da visita</button></p></form><div id="resultado" hidden><label>Link para o cliente<input id="link" readonly></label><button id="copiar">Copiar mensagem</button> <a id="zap" class="btn" target="_blank" rel="noopener">Enviar pelo WhatsApp</a> <a id="abrir" class="btn" target="_blank" rel="noopener">Visualizar visita</a></div></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://dtkszimtovtqdojjpqsy.supabase.co','sb_publishable_sLtgD3fLRhSkrNWd_3M5Ww_a7q4gxJi');const $=id=>document.getElementById(id);
let rows=[], selected=new Set();function render(){const q=$('busca').value.toLowerCase();$('lista').replaceChildren();for(const r of rows.filter(r=>selected.has(r.id)||[r.codigo,r.titulo,r.bairro].join(' ').toLowerCase().includes(q)).slice(0,100)){const l=document.createElement('label');l.className='check';const c=document.createElement('input');c.type='checkbox';c.checked=selected.has(r.id);c.onchange=()=>{c.checked?selected.add(r.id):selected.delete(r.id)};l.append(c,document.createTextNode([r.codigo,r.titulo,r.bairro].filter(Boolean).join(' • ')));$('lista').append(l)}}$('busca').oninput=render;
let message='';$('form').onsubmit=async e=>{e.preventDefault();$('salvar').disabled=true;$('resultado').hidden=true;try{const items=rows.filter(r=>selected.has(r.id)).map(r=>({id:r.id,titulo:r.titulo,bairro:r.bairro}));if($('extra').value.trim())items.push({titulo:$('extra').value.trim()});if(!items.length)throw Error('Selecione pelo menos um imóvel ou informe um ponto de encontro.');const when=new Date($('data').value+':00-03:00');if(!Number.isFinite(+when)||when<=new Date())throw Error('Informe uma data futura.');const token=crypto.randomUUID();const {error}=await db.from('portal_visitas').insert({token,cliente_nome:$('cliente').value.trim(),corretor:$('corretor').value,imoveis:items,data_hora:when.toISOString(),duracao_minutos:Number($('duracao').value),situacao:'confirmada'});if(error)throw error;const url=new URL('visita.html',location.href);url.searchParams.set('token',token);$('link').value=url.href;$('abrir').href=url.href;message='Olá, '+$('cliente').value.trim()+'! Seguem os detalhes da nossa visita agendada: '+url.href;$('zap').href='https://wa.me/?text='+encodeURIComponent(message);$('resultado').hidden=false;$('status').textContent='Visita registrada. Compartilhe o link.'}catch(e){$('status').textContent=e.message}finally{$('salvar').disabled=false}};$('copiar').onclick=async()=>{try{await navigator.clipboard.writeText(message);$('status').textContent='Mensagem copiada.'}catch(e){$('link').select();$('status').textContent='Copie o link manualmente.'}};
(async()=>{try{const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Entre primeiro no painel administrativo.');const a=await db.rpc('portal_eh_admin');if(a.error||a.data!==true)throw Error('Acesso não autorizado.');for(let offset=0;;offset+=500){const r=await db.from('imoveis').select('id,codigo,titulo,bairro').order('id').range(offset,offset+499);if(r.error)throw r.error;rows.push(...r.data);if(r.data.length<500)break}render();$('app').hidden=false;$('status').textContent=''}catch(e){$('status').textContent=e.message}})();</script></body></html>
