<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#F6F1EA;color:#14253D;font:16px Arial,sans-serif}header{background:#14253D;color:white;padding:22px}main{max-width:780px;margin:auto;padding:20px}section{background:white;border-radius:16px;padding:22px;margin:0 0 16px}label{display:block;margin:12px 0}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit;margin-top:5px}button,a.btn{display:inline-block;background:#F85F08;color:white;border:0;border-radius:9px;padding:12px 16px;font:inherit;text-decoration:none;cursor:pointer;margin:5px 0}button:disabled{opacity:.5}a{color:#14253D}small{color:#596577}li{padding:8px 0}[hidden]{display:none!important} .check{display:flex;align-items:center;gap:10px}.check input{width:auto}#status{white-space:pre-wrap}</style><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Pesquisas pós-visita | Portal Bauru Imóveis</title></head><body><header>PORTAL BAURU IMÓVEIS</header><main><a href="admin.html">← Voltar ao painel</a><h1>Pesquisa pós-visita</h1><p id="status" role="status">Verificando acesso...</p><section id="app" hidden><form id="form"><label>Reaproveitar uma visita registrada<select id="visitas"><option value="">Selecionar manualmente</option></select></label><label>Cliente<input id="cliente" required maxlength="120"></label><label>Corretor<select id="corretor"><option>Rafael Gomes</option><option>Débora Navas</option></select></label><label>Pesquisar imóveis<input id="busca"></label><div id="lista"></div><label>Imóveis de parceiros (um por linha)<textarea id="extra" maxlength="2000"></textarea></label><button id="save">Gerar pesquisa</button></form><div id="resultado" hidden><input id="link" readonly><button id="copiar">Copiar mensagem</button> <a class="btn" id="zap" target="_blank" rel="noopener noreferrer">Enviar pelo WhatsApp</a></div></section><section id="historico" hidden><h2>Pesquisas enviadas</h2><button id="reload">Atualizar respostas</button><div id="hist"></div></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://dtkszimtovtqdojjpqsy.supabase.co','sb_publishable_sLtgD3fLRhSkrNWd_3M5Ww_a7q4gxJi');const $=id=>document.getElementById(id);const status=t=>$('status').textContent=t;const el=(tag,t)=>{const n=document.createElement(tag);n.textContent=t;return n};

let rows=[], visits=[], selected=new Set(), message='';const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();function render(){const q=norm($('busca').value);$('lista').replaceChildren();for(const r of rows.filter(r=>selected.has(r.id)||norm([r.codigo,r.titulo,r.bairro].join(' ')).includes(q)).sort((a,b)=>Number(selected.has(b.id))-Number(selected.has(a.id))).slice(0,100)){const l=el('label',[r.codigo,r.titulo,r.bairro].filter(Boolean).join(' • '));l.className='check';const c=el('input','');c.type='checkbox';c.checked=selected.has(r.id);c.onchange=()=>{c.checked?selected.add(r.id):selected.delete(r.id)};l.prepend(c);$('lista').append(l)}}$('busca').oninput=render;
$('visitas').onchange=()=>{const v=visits.find(x=>x.id===$('visitas').value);if(!v)return;$('cliente').value=v.cliente_nome||'';$('corretor').value=v.corretor||'Rafael Gomes';const arr=Array.isArray(v.imoveis)?v.imoveis:[];selected=new Set(arr.filter(x=>rows.some(r=>r.id===x.id)).map(x=>x.id));$('extra').value=arr.filter(x=>!rows.some(r=>r.id===x.id)).map(x=>[x.titulo,x.bairro].filter(Boolean).join(' • ')).join('\n');render()};
function url(token){const u=new URL('pesquisa.html',location.href);u.searchParams.set('token',token);return u.href}function share(r){const link=url(r.token);$('link').value=link;message='Olá, '+r.cliente_nome+'! Gostaria de saber como foi nossa visita. Sua opinião vai me ajudar a selecionar imóveis mais adequados ao que você procura. '+link;$('zap').href='https://wa.me/?text='+encodeURIComponent(message);$('resultado').hidden=false;$('resultado').scrollIntoView({block:'nearest'})}
async function history(){const r=await db.from('portal_pesquisas_visita').select('id,token,cliente_nome,corretor,imoveis,respostas,criado_em,expira_em,respondido_em').order('criado_em',{ascending:false}).limit(100);if(r.error)throw r.error;$('hist').replaceChildren();for(const x of r.data){const d=el('section','');d.style.border='1px solid #ddd';d.append(el('h3',x.cliente_nome),el('p',x.corretor+' • '+new Date(x.criado_em).toLocaleDateString('pt-BR')+' • '+(x.respondido_em?'Respondida':new Date(x.expira_em)<new Date()?'Expirada':'Aguardando resposta')));const a=x.respostas;if(a){for(const v of a.avaliacoes||[]){d.append(el('h4',(v.imovel?.titulo||'Imóvel')+' — '+v.nota+'/5'),el('p','Positivos: '+(v.positivos||'—')),el('p','Negativos: '+(v.negativos||'—')))}const name=k=>k==='nenhum'?'Nenhum':x.imoveis?.[Number(k)]?.titulo||'—';d.append(el('p','Preferido: '+name(a.favorito)),el('p','Menos gostou: '+name(a.menos_gostou)),el('p','Proposta: '+(a.intencao_proposta||'—')),el('p','O que faltou: '+(a.faltou||'—')),el('p','Observações: '+(a.observacoes||'—')))}else{const b=el('button','Compartilhar link');b.onclick=()=>share(x);d.append(b)}$('hist').append(d)}if(!r.data.length)$('hist').textContent='Nenhuma pesquisa registrada.'}
$('reload').onclick=()=>history().catch(e=>status(e.message));$('copiar').onclick=async()=>{try{await navigator.clipboard.writeText(message);status('Mensagem copiada.')}catch(e){$('link').select();status('Copie o link manualmente.')}};
$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{const imoveis=rows.filter(r=>selected.has(r.id)).map(r=>({id:r.id,titulo:r.titulo,bairro:r.bairro}));for(const t of $('extra').value.split('\n').map(t=>t.trim()).filter(Boolean))imoveis.push({titulo:t});if(!imoveis.length||imoveis.length>20)throw Error('Selecione de 1 a 20 imóveis.');const p={token:crypto.randomUUID(),cliente_nome:$('cliente').value.trim(),corretor:$('corretor').value,imoveis};if(!p.cliente_nome)throw Error('Informe o cliente.');const r=await db.from('portal_pesquisas_visita').insert(p);if(r.error)throw r.error;share(p);status('Pesquisa criada.');await history()}catch(e){status(e.message)}finally{$('save').disabled=false}};
(async()=>{try{const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Entre primeiro no painel administrativo.');const a=await db.rpc('portal_eh_admin');if(a.error||a.data!==true)throw Error('Acesso não autorizado.');for(let offset=0;;offset+=500){const r=await db.from('imoveis').select('id,codigo,titulo,bairro').order('id').range(offset,offset+499);if(r.error)throw r.error;rows.push(...r.data);if(r.data.length<500)break}const v=await db.from('portal_visitas').select('id,cliente_nome,corretor,imoveis,data_hora').order('data_hora',{ascending:false}).limit(100);if(v.error)throw v.error;visits=v.data;for(const x of visits){const o=el('option',x.cliente_nome+' — '+new Date(x.data_hora).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}));o.value=x.id;$('visitas').append(o)}render();$('app').hidden=false;$('historico').hidden=false;status('');await history()}catch(e){status(e.message)}})();
</script></body></html>
