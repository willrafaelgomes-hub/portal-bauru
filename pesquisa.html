<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#F6F1EA;color:#14253D;font:16px Arial,sans-serif}header{background:#14253D;color:white;padding:22px}main{max-width:780px;margin:auto;padding:20px}section{background:white;border-radius:16px;padding:22px;margin:0 0 16px}label{display:block;margin:12px 0}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit;margin-top:5px}button,a.btn{display:inline-block;background:#F85F08;color:white;border:0;border-radius:9px;padding:12px 16px;font:inherit;text-decoration:none;cursor:pointer;margin:5px 0}button:disabled{opacity:.5}a{color:#14253D}small{color:#596577}li{padding:8px 0}[hidden]{display:none!important} .check{display:flex;align-items:center;gap:10px}.check input{width:auto}#status{white-space:pre-wrap}</style><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Sua opinião | Portal Bauru Imóveis</title></head><body><header>PORTAL BAURU IMÓVEIS</header><main><h1>Como foi sua visita?</h1><p id="status" role="status">Carregando...</p><section id="app" hidden><h2 id="cliente"></h2><p>Sua opinião nos ajuda a encontrar o imóvel ideal.</p><form id="form"><div id="items"></div><label>Qual imóvel você mais gostou?<select id="fav" required></select></label><label>Qual menos gostou?<select id="least"></select></label><label>Você gostaria de apresentar uma proposta?<select id="intencao" required><option value="">Selecione</option><option>Sim</option><option>Talvez</option><option>Não</option></select></label><label>O que faltou para tomar a decisão?<textarea id="faltou" maxlength="1000"></textarea></label><label>Observações adicionais<textarea id="obs" maxlength="1000"></textarea></label><button id="send">Enviar avaliação</button></form></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://dtkszimtovtqdojjpqsy.supabase.co','sb_publishable_sLtgD3fLRhSkrNWd_3M5Ww_a7q4gxJi');const $=id=>document.getElementById(id);const status=t=>$('status').textContent=t;const el=(tag,t)=>{const n=document.createElement(tag);n.textContent=t;return n};

const token=new URLSearchParams(location.search).get('token');let items=[];let fields=[];
(async()=>{try{if(!token||!/^([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$/i.test(token))throw Error('Link inválido.');const r=await db.rpc('portal_consultar_pesquisa_v2',{p_token:token});if(r.error)throw r.error;const v=Array.isArray(r.data)?r.data[0]:r.data;if(!v)throw Error('Pesquisa não encontrada ou expirada.');if(v.respondida||v.respondido_em){status('Obrigado! Sua avaliação já foi recebida.');return}items=Array.isArray(v.imoveis)?v.imoveis:[];if(!items.length)throw Error('Nenhum imóvel nesta pesquisa.');$('cliente').textContent='Olá, '+(v.cliente_nome||'')+'!';for(const id of ['fav','least']){const o=el('option','Nenhum / não se aplica');o.value='nenhum';$(id).append(o)}items.forEach((item,i)=>{const name=[item.titulo,item.bairro].filter(Boolean).join(' • ');const box=el('section','');box.style.border='1px solid #ddd';box.append(el('h3',name));const label=el('label','Nota de 1 a 5');const select=el('select','');select.required=true;for(const [val,txt] of [['','Selecione'],['1','1 — Não gostei'],['2','2'],['3','3'],['4','4'],['5','5 — Gostei muito']]){const o=el('option',txt);o.value=val;select.append(o)}label.append(select);box.append(label);const pos=el('textarea',''),neg=el('textarea','');for(const [t,n] of [['Pontos positivos',pos],['Pontos negativos',neg]]){n.maxLength=500;const l=el('label',t);l.append(n);box.append(l)}$('items').append(box);fields.push({select,pos,neg});for(const id of ['fav','least']){const o=el('option',name);o.value=String(i);$(id).append(o)}});$('app').hidden=false;status('')}catch(e){status(e.message)}})();
$('form').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;try{const respostas={avaliacoes:items.map((item,i)=>({imovel:item,nota:Number(fields[i].select.value),positivos:fields[i].pos.value.trim(),negativos:fields[i].neg.value.trim()})),favorito:$('fav').value,menos_gostou:$('least').value,intencao_proposta:$('intencao').value,faltou:$('faltou').value.trim(),observacoes:$('obs').value.trim()};const r=await db.rpc('portal_responder_pesquisa_v2',{p_token:token,p_respostas:respostas});if(r.error)throw r.error;if(r.data===false)throw Error('Pesquisa já respondida ou expirada.');$('app').hidden=true;status('Obrigado! Sua avaliação foi enviada ao corretor.')}catch(e){status(e.message)}finally{$('send').disabled=false}};
</script></body></html>
